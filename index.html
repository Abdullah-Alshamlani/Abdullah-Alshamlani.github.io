<style>
  :root{
    --bg:#0a0e14; --bg2:#0f141c; --card:#121924; --line:#1f2a3a;
    --text:#e6edf3; --muted:#8b98a9; --accent:#22d3ee; --accent2:#a78bfa; --green:#4ade80;
    --radius:14px;
    --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html[lang="ar"]{ --font:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7;overflow-x:hidden;
    background-image:linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);
    background-size:44px 44px;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px}
  .mono{font-family:var(--mono)}
  ::selection{background:var(--accent);color:var(--bg)}

  /* nav */
  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(10,14,20,.78);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
  .logo{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:1.05rem;direction:ltr}
  .logo span{color:var(--muted)}
  .links{display:flex;gap:26px;align-items:center}
  .links a{color:var(--muted);font-size:.92rem;transition:color .2s}
  .links a:hover{color:var(--text)}
  .lang{font-family:var(--mono);border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.85rem;display:flex;gap:8px;align-items:center;transition:border-color .2s}
  .lang:hover{border-color:var(--accent)}
  .lang b{color:var(--accent)}
  .menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}

  /* hero */
  .hero{padding:110px 0 90px;position:relative}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 15% 20%,rgba(34,211,238,.12),transparent 70%),radial-gradient(500px 300px at 85% 60%,rgba(167,139,250,.10),transparent 70%);pointer-events:none}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;position:relative}
  .badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.8rem;color:var(--green);border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.06);padding:6px 12px;border-radius:999px;margin-bottom:22px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.15;font-weight:800;letter-spacing:-.02em}
  html[lang="ar"] h1{letter-spacing:0;line-height:1.35}
  h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .role{font-family:var(--mono);color:var(--accent);margin:14px 0 18px;font-size:1.05rem}
  .lead{color:var(--muted);font-size:1.07rem;max-width:560px}
  .cta{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:10px;font-weight:600;font-size:.95rem;transition:transform .2s,box-shadow .2s,border-color .2s}
  .btn-primary{background:var(--accent);color:var(--bg)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,211,238,.25)}
  .btn-ghost{border:1px solid var(--line);background:var(--card)}
  .btn-ghost:hover{border-color:var(--accent);transform:translateY(-2px)}
  .btn svg{width:18px;height:18px}

  /* terminal */
  .term{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45);direction:ltr;text-align:left}
  .term-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0c1118}
  .term-bar i{width:11px;height:11px;border-radius:50%;display:block}
  .term-bar i:nth-child(1){background:#ff5f57}.term-bar i:nth-child(2){background:#febc2e}.term-bar i:nth-child(3){background:#28c840}
  .term-bar span{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
  .term-body{padding:20px 22px;font-family:var(--mono);font-size:.86rem;line-height:1.9;min-height:270px}
  .t-prompt{color:var(--green)} .t-cmd{color:var(--text)} .t-out{color:var(--muted)} .t-key{color:var(--accent2)} .t-str{color:#fbbf24} .t-acc{color:var(--accent)}
  .cursor{display:inline-block;width:8px;height:1.05em;background:var(--accent);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* sections */
  section{padding:90px 0}
  .sec-head{margin-bottom:44px}
  .sec-tag{font-family:var(--mono);color:var(--accent);font-size:.85rem;margin-bottom:8px;direction:ltr;display:inline-block}
  h2{font-size:clamp(1.7rem,3vw,2.3rem);font-weight:700}
  .about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:36px}
  .about-text p{color:var(--muted);font-size:1.04rem;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .stat b{display:block;direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:1.9rem;color:var(--accent);line-height:1.2}
  .stat span{color:var(--muted);font-size:.9rem}
  .muted-p{color:var(--muted);font-size:.94rem}
  .sec-note{color:var(--muted);margin-top:8px}

  .skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:border-color .25s,transform .25s}
  .card:hover{border-color:rgba(34,211,238,.45);transform:translateY(-3px)}
  .card h3{font-size:1rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .card h3 .ic{font-family:var(--mono);color:var(--accent);font-size:.85rem;direction:ltr}
  .chips{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:flex-start}
  html[dir="rtl"] .chips{justify-content:flex-end}
  .chip{font-family:var(--mono);font-size:.78rem;padding:5px 11px;border-radius:7px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.18);color:#bfefff}

  .timeline{position:relative;padding-inline-start:30px}
  .timeline::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--accent2),transparent)}
  .job{position:relative;margin-bottom:26px}
  .job::before{content:"";position:absolute;inset-inline-start:-29px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
  .job-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .job h3{font-size:1.1rem;font-weight:600}
  .job .co{color:var(--accent);font-size:.95rem}
  .job .date{font-family:var(--mono);font-size:.8rem;color:var(--muted);white-space:nowrap;direction:ltr}
  .job ul{list-style:none;margin-top:12px}
  .job li{color:var(--muted);font-size:.95rem;padding-inline-start:20px;position:relative;margin-bottom:6px}
  .job li::before{content:"▹";position:absolute;inset-inline-start:0;color:var(--accent)}
  html[dir="rtl"] .job li::before{content:"◃"}

  .projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
  .proj{display:flex;flex-direction:column}
  .proj-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .folder{font-size:1.6rem;color:var(--accent)}
  .proj-top a{color:var(--muted);transition:color .2s}
  .proj-top a:hover{color:var(--accent)}
  .proj-top svg{width:20px;height:20px}
  .proj h3{font-size:1.15rem;margin-bottom:4px}
  .proj .url{font-family:var(--mono);font-size:.8rem;color:var(--accent);margin-bottom:12px;direction:ltr;display:inline-block}
  .proj p{color:var(--muted);font-size:.94rem;flex:1}
  .proj .chips{margin-top:18px}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .edu-item{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .edu-item:last-child{margin-bottom:0}
  .edu-ic{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:var(--accent2);font-family:var(--mono);font-size:.85rem}
  .edu-item h4{font-size:1rem;font-weight:600}
  .edu-item p{color:var(--muted);font-size:.9rem}

  .contact{text-align:center}
  .contact .lead{margin:14px auto 34px}
  .contact-links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .cform{max-width:640px;margin:0 auto 28px;text-align:start;display:grid;gap:16px}
  .cform:hover{transform:none}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cform label{display:grid;gap:6px;font-size:.88rem;color:var(--muted)}
  .cform input,.cform textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none;transition:border-color .2s;resize:vertical}
  .cform input:focus,.cform textarea:focus{border-color:var(--accent)}
  .cform .btn{justify-self:start;border:none;cursor:pointer}
  .cform .btn:disabled{opacity:.6;cursor:wait}
  .hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
  .fstatus{font-size:.9rem;min-height:1.4em}
  .fstatus.ok{color:var(--green)} .fstatus.err{color:#f87171}
  @media (max-width:600px){.row2{grid-template-columns:1fr}}

  footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--muted);font-size:.85rem}
  footer .mono{color:var(--accent)}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:860px){
    .hero{padding:70px 0 60px}
    .hero-grid,.about-grid,.two{grid-template-columns:1fr}
    .links{display:none;position:absolute;top:64px;inset-inline:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);padding:18px;gap:16px}
    .links.open{display:flex}
    .menu-btn{display:block}
    section{padding:64px 0}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(lang){
  const T = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar" ? "عبدالله الشملاني | مطوّر ASP.NET Core Web API" : "Abdullah Al-Shamlani | ASP.NET Core Web API Developer";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n] ?? ""; });
  document.getElementById("langLabel").innerHTML = lang === "ar" ? "<b>EN</b> English" : "<b>ع</b> العربية";

  document.getElementById("skillsGrid").innerHTML = SKILLS.map(s =>
    `<div class="card"><h3><span class="ic">${esc(s.ic)}</span>${s[lang]}</h3><div class="chips">${s.items.map(i=>`<span class="chip">${i}</span>`).join("")}</div></div>`).join("");

  document.getElementById("focusGrid").innerHTML = FOCUS.map(f => `<div class="card"><h3><span class="ic">${esc(f.ic)}</span>${f[lang].t}</h3><p class="muted-p">${f[lang].d}</p></div>`).join("");

  document.getElementById("timeline").innerHTML = JOBS.map(j => { const d=j[lang]; return `
    <div class="job card"><div class="job-head"><div><h3>${d.t}</h3><div class="co">${d.c}</div></div><div class="date">${lang==="ar"?j.dateAr:j.date}</div></div>
    <ul>${d.b.map(b=>`<li>${b}</li>`).join("")}</ul></div>`; }).join("");

  document.getElementById("projGrid").innerHTML = PROJECTS.map(p => { const d=p[lang]; return `
    <div class="card proj"><div class="proj-top"><span class="folder mono">&lt;/&gt;</span><a href="${p.url}" target="_blank" rel="noopener" aria-label="${d.t}">${EXT}</a></div>
    <h3>${d.t}</h3><a class="url" href="${p.url}" target="_blank" rel="noopener">${p.host}</a><p>${d.d}</p>
    <div class="chips">${p.tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div></div>`; }).join("");
}

function getLang(){
  try { const s = localStorage.getItem("lang"); if (s === "ar" || s === "en") return s; } catch(e){}
  return (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";
}

render(lang);
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch(e){}
  render(lang);
});

/* contact form (FormSubmit) */
const form = document.getElementById("contactForm"), fStatus = document.getElementById("fStatus"), fBtn = document.getElementById("fBtn");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const T = I18N[lang], v = id => document.getElementById(id).value.trim();
  const name=v("fName"), email=v("fEmail"), subject=v("fSubject"), message=v("fMsg");
  if (!name || !subject || !message || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fStatus.className="fstatus err"; fStatus.textContent=T["form.invalid"]; return; }
  if (form._honey.value) return;
  fBtn.disabled = true; fStatus.className="fstatus"; fStatus.textContent=T["form.sending"];
  try {
    const res = await fetch("https://formsubmit.co/ajax/abdullah.mufarreh.23@gmail.com", {
      method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({ name, email, _replyto: email, _subject: "[Portfolio] " + subject, subject, message, _template:"table", _captcha:"false" })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || String(data.success) === "false") throw new Error();
    fStatus.className="fstatus ok"; fStatus.textContent=T["form.ok"]; form.reset();
  } catch { fStatus.className="fstatus err"; fStatus.textContent=T["form.err"]; }
  finally { fBtn.disabled = false; }
});

  ['<span class="t-prompt">abdullah@dev</span>:<span class="t-acc">~</span>$ ', '<span class="t-cmd">dotnet run --project Api</span>'],
  ['', '<span class="t-out">info: Now listening on: </span><span class="t-acc">abdullah-alshamlani.github.io</span>'],
];
const term = document.getElementById("term");
let li = 0;
function typeLine(){
  if (li >= lines.length){ term.insertAdjacentHTML("beforeend", '<div><span class="t-prompt">abdullah@dev</span>:<span class="t-acc">~</span>$ <span class="cursor"></span></div>'); return; }
  const [p, html] = lines[li++];
  const row = document.createElement("div"); row.innerHTML = p; term.appendChild(row);
  const tmp = document.createElement("span"); tmp.innerHTML = html; const text = tmp.textContent;
  if (!p) { row.innerHTML += html; setTimeout(typeLine, 180); return; }
  const span = document.createElement("span"); span.className = "t-cmd"; row.appendChild(span);
  let i = 0; const t = setInterval(() => { span.textContent = text.slice(0, ++i); if (i >= text.length){ clearInterval(t); setTimeout(typeLine, 350); } }, 55);
}
setTimeout(typeLine, 500);

/* reveal on scroll */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
